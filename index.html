<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
   <form>
        <div class="form_box">
            
            <h1>Favorite Game Survey</h1>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="contact_info">
                    <label for="name" >Name:</label>
                    <input type="text" name="name" id="name" placeholder="Full Name">
                </div>
                <div class="contact_info">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="@email.com">
                </div>
                <div class="contact_info">
                    <label for="number">Number:</label>
                    <input type="number" name="number" id="number" class="no-spin" placeholder="Phone Number">
                </div>
                <div class="contact_info">
                    <label for="country">Country:</label>
                    <select name="country" id="country">
                        <option value="country" id="choose">choose...</option>
                        <option value="country">Algeria</option>
                        <option value="country">Belgium</option>
                        <option value="country">Canada</option>
                        <option value="country">Denmark</option>
                        <option value="country">England</option>
                        <option value="country">France</option>
                        <option value="country">Ghana</option>
                        <option value="country">Hungary</option>
                        <option value="country">Iceland</option>
                        <option value="country">Jamiaca</option>
                        <option value="country">Kenya</option>
                        <option value="country">Luxembourg</option>
                        <option value="country">Mexico</option>
                        <option value="country">Nepal</option>
                        <option value="country">Oman</option>
                        <option value="country">Peru</option>
                        <option value="country">Qatar</option>
                        <option value="country">Russia</option>
                        <option value="country">Spain</option>
                        <option value="country">Turkey</option>
                        <option value="country">Uganda</option>
                        <option value="country">Venezuela</option>
                        <option value="country">Vatican City</option>
                        <option value="country">Yemen</option>
                        <option value="country">Zambia</option>
                        <option value="country">Zimbabwe</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Favorite game type</legend>
                <div>
                    <input type="checkbox" name="arcade" id="arcade">
                    <label for="arcade">Arcade games</label>
                    <input type="checkbox" name="strategy" id="strategy">
                    <label for="strategy">Strategy games</label>
                    <input type="checkbox" name="adventure" id="adventure">
                    <label for="adventure">Adventure games</label>
                    <input type="checkbox" name="sport" id="sport">
                    <label for="sport">Sport games</label>
                    
                </div>
                <div>
                    <textarea name="about" id="about" rows="6" cols="50" placeholder="Tell us about the game type and why its your favorite..."></textarea>
                </div>
            </fieldset>
        </div>
    </form>
<script src="script.js"></script>
</body>
</html>
