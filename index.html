<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
   <form action="https://httpbin.org/post" method="post" id="form">
        <div class="form_box">
            
            <h1>Favorite Game Survey</h1>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="contact_info error">
                    <label for="name" >Name:</label>
                    <input type="text" name="name" id="name" placeholder="Full Name">
                </div>
                <div class="contact_info error">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="@email.com">
                </div>
                <div class="contact_info error">
                    <label for="number">Number:</label>
                    <input type="number" name="number" id="number" class="no-spin" placeholder="Phone Number">
                </div>
                <div class="contact_info error">
                    <label for="country">Country:</label>
                    <select name="countries" id="country">
                        <option value="" disabled selected>choose...</option>
                        <option value="Algeria">Algeria</option>
                        <option value="Belgium">Belgium</option>
                        <option value="Canada">Canada</option>
                        <option value="Denmark">Denmark</option>
                        <option value="England">England</option>
                        <option value="France">France</option>
                        <option value="Ghana">Ghana</option>
                        <option value="Hungary">Hungary</option>
                        <option value="Iceland">Iceland</option>
                        <option value="Jamiaca">Jamiaca</option>
                        <option value="Kenya">Kenya</option>
                        <option value="Luxembourg">Luxembourg</option>
                        <option value="Mexico">Mexico</option>
                        <option value="Nepal">Nepal</option>
                        <option value="Oman">Oman</option>
                        <option value="Peru">Peru</option>
                        <option value="Qatar">Qatar</option>
                        <option value="Russia">Russia</option>
                        <option value="Spain">Spain</option>
                        <option value="Turkey">Turkey</option>
                        <option value="Uganda">Uganda</option>
                        <option value="Venezuela">Venezuela</option>
                        <option value="Vatican">Vatican City</option>
                        <option value="Yemen">Yemen</option>
                        <option value="Zambia">Zambia</option>
                        <option value="Zimbabwe">Zimbabwe</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Favorite game type:</legend>
                <div class="favorite error">
                    <div class="games">
                        <label for="arcade"></label><input type="radio" name="Arcade" id="arcade">Arcade games</label>
                    </div>
                    <div class="games">
                        <label for="strategy"></label><input type="radio" name="Strategy" id="strategy">Strategy games</label>
                    </div>
                    <div class="games">
                        <label for="adventure"></label><input type="radio" name="Adventure" id="adventure">Adventure games</label>
                    </div>
                    <div class="games">
                        <label for="sport"></label><input type="radio" name="Sport" id="sport">Sport games</label>
                    </div>
                    
                </div>
                <div class="favorite error">
                    <textarea name="thoughts" id="thoughts" rows="6" cols="50" placeholder="Tell us about the game type and why its your favorite..."></textarea>
                </div>
                <button type="submit" id="submit">Submit</button>
            </fieldset>

        </div>
    </form>
<script src="script.js"></script>
</body>
</html>
